# Builds the Android app (APK) automatically every time you upload changes.
# Download it from: Actions tab → latest "Build Android APK" run → Artifacts → bibo-adventure-apk
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners already ship the Android SDK (ANDROID_HOME),
      # so no separate SDK setup step is needed.

      - name: Copy the game into the app
        run: |
          mkdir -p www/icons
          cp index.html manifest.webmanifest www/
          cp icons/*.png www/icons/

      - name: Create the Android project (Capacitor)
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Bibo Adventure" com.mohammed.bibo --web-dir www
          npx cap add android
          npx cap sync android

      - name: App name, landscape mode, icon
        run: |
          RES=android/app/src/main/res
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">مغامرة بيبو</string>|' $RES/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">مغامرة بيبو</string>|' $RES/values/strings.xml
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' android/app/src/main/AndroidManifest.xml
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/android/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher.png
            cp icons/android/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
          done

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../bibo-adventure.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bibo-adventure-apk
          path: bibo-adventure.apk
