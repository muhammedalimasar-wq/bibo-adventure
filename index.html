<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #090514; overflow: hidden; }
  body { font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; display: flex; align-items: center; justify-content: center;
         user-select: none; -webkit-user-select: none; }
  #wrap { position: relative; width: min(100vw, 200vh); aspect-ratio: 2 / 1; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 6px; }

  /* glassmorphism HUD with thin neon frame */
  .hud { position: absolute; top: 2%; left: 1.5%; right: 1.5%; display: flex; gap: 10px; justify-content: space-between;
         pointer-events: none; font-size: clamp(14px, 2.2vw, 24px); font-weight: 800; }
  .glass { background: rgba(40, 20, 80, .32); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
           border: 1.5px solid rgba(0, 243, 255, .75); border-radius: 999px;
           box-shadow: 0 0 12px rgba(0, 243, 255, .45), inset 0 0 10px rgba(255, 255, 255, .07);
           color: #eaffff; text-shadow: 0 0 6px rgba(0, 243, 255, .8); }
  .hud .pill { padding: 2px 16px; }

  .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: rgba(9, 5, 20, .55); backdrop-filter: blur(3px); }
  .card { background: rgba(26, 11, 46, .78); backdrop-filter: blur(10px); border: 1.5px solid rgba(255, 0, 127, .7);
          border-radius: 26px; padding: 22px 26px; text-align: center; width: min(620px, 92%);
          box-shadow: 0 0 24px rgba(255, 0, 127, .35), 0 0 60px rgba(0, 243, 255, .12); overflow: visible; color: #e9e3ff; transform-origin: center center; }
  .card h1 { font-size: clamp(28px, 4.5vw, 46px); color: #7ffaff; line-height: 1.15;
             text-shadow: 0 0 8px #00f3ff, 0 0 22px rgba(0, 243, 255, .6); }
  .card p { font-size: clamp(14px, 1.9vw, 20px); color: #c9bfef; margin: 6px 0 12px; }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 8px 0 12px; }
  .btn { font-family: inherit; font-size: clamp(16px, 2.2vw, 24px); font-weight: 800; border-radius: 16px; padding: 10px 12px;
         color: #fff; cursor: pointer; background: rgba(20, 10, 40, .6); border: 2px solid var(--c);
         box-shadow: 0 0 10px var(--c), inset 0 0 10px color-mix(in srgb, var(--c) 35%, transparent);
         text-shadow: 0 0 6px var(--c); transition: transform .08s, background .15s; }
  .btn:hover { background: color-mix(in srgb, var(--c) 25%, rgba(20, 10, 40, .6)); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { --c: #5a5470; color: #8c86a6; cursor: not-allowed; box-shadow: none; text-shadow: none; }
  .btn small { display: block; font-size: .7em; font-weight: 500; }
  .l1, .green { --c: #00f3ff; } .l2, .blue { --c: #ff007f; } .l3 { --c: #b26bff; } .gray { --c: #8f86c4; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .keys { font-size: clamp(12px, 1.6vw, 16px); color: #a99fd6; margin-top: 10px; line-height: 1.8; }
  kbd { background: rgba(0, 243, 255, .08); border: 1px solid rgba(0, 243, 255, .6); border-radius: 6px; padding: 0 6px;
        font-family: inherit; direction: ltr; display: inline-block; color: #bffcff; }
  .stars { font-size: clamp(30px, 5vw, 52px); letter-spacing: 6px; filter: drop-shadow(0 0 8px #ffd23f); }
  .hidden { display: none !important; }
  /* style picker */
  .skinRow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 4px 0 12px; }
  .skinLabel { font-weight: 800; margin-top: 4px; }
  .skinBtn { --c: #8f86c4; opacity: .75; white-space: nowrap; font-size: clamp(14px, 1.9vw, 20px); padding: 8px 6px; }
  .screen { overflow: hidden; }
  .skinBtn.selected { opacity: 1; outline: 3px solid #fff; outline-offset: 2px; }

  /* classic style */
  .skin-classic .card { background: #fff; border: 0; color: #333; box-shadow: 0 8px 0 rgba(0,0,0,.18); }
  .skin-classic .card h1 { color: #1f8a8a; text-shadow: none; }
  .skin-classic .card p, .skin-classic .keys { color: #555; }
  .skin-classic .btn, .skin-cowboy .btn { background: var(--c); border: 0; text-shadow: none; box-shadow: 0 5px 0 rgba(0,0,0,.22); }
  .skin-classic .btn:disabled, .skin-cowboy .btn:disabled { background: #b9b2a6; }

<script>

try { lang = localStorage.getItem('bibo-lang') || 'ar'; } catch (e) {}
const L = () => TEXT[lang];

// =================== progress ===================
let progress = { unlocked: 1, best: {} };
try { const p = JSON.parse(localStorage.getItem('bibo-progress')); if (p) progress = p; } catch (e) {}

// =================== sound ===================
let actx = null;
function ac() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return actx; }
function tone(f, d, type = 'square', v = .08, slide = 0, delay = 0) {
  const a = ac(); if (!a) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d);
}
const SND = {
  jump: () => tone(330, .15, 'square', .06, 2),
  gem: () => { tone(988, .08, 'triangle', .12); tone(1319, .15, 'triangle', .12, 0, .07); },
  stomp: () => tone(200, .15, 'square', .1, .4),
  spring: () => tone(220, .3, 'triangle', .14, 4),
  pipe: () => tone(400, .45, 'sine', .14, .25),
  hurt: () => { tone(400, .2, 'sawtooth', .1, .5); tone(200, .4, 'sawtooth', .1, .5, .2); },
  check: () => [523, 659, 784].forEach((f, i) => tone(f, .12, 'triangle', .12, 0, i * .08)),
  spit: () => tone(300, .12, 'triangle', .06, .5),
  plane: () => tone(90, 1.4, 'sawtooth', .03, 1.3),
  bombDrop: () => tone(1400, .7, 'sine', .04, .35),

  empty: () => tone(1400, .03, 'square', .05),
  hit: () => tone(600, .05, 'square', .06, .6),
  boom: () => { tone(90, .5, 'sawtooth', .16, .3); tone(60, .6, 'square', .1, .4, .05); },
  cannon: () => tone(110, .3, 'sawtooth', .1, .4),
  mg: () => { for (let i = 0; i < 3; i++) tone(500, .04, 'square', .04, .5, i * .07); },
  win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .14, 0, i * .12)),
};

// =================== level building ===================
const T = 32, H = 15, VIEW_W = 960, VIEW_H = 480;

class Builder {
  constructor(W) {
    this.W = W; this.g = Array.from({ length: H }, () => Array(W).fill('.'));
    this.gems = []; this.enemies = []; this.movers = []; this.checks = []; this.pipes = []; this.links = {}; this.rooms = [];
    this.start = { x: 2, y: 11 }; this.door = null;
  }
  set(x, y, c) { if (x >= 0 && x < this.W && y >= 0 && y < H) this.g[y][x] = c; return this; }
  get(x, y) { return (x >= 0 && x < this.W && y >= 0 && y < H) ? this.g[y][x] : '.'; }
  ground(x1, x2, top = 12) { for (let x = x1; x <= x2; x++) for (let y = top; y < H; y++) this.set(x, y, '#'); return this; }
  plat(x, y, n, c = 'B') { for (let i = 0; i < n; i++) this.set(x + i, y, c); return this; }
  col(x, y1, y2, c = '#') { for (let y = y1; y <= y2; y++) this.set(x, y, c); return this; }
  gemRow(x, y, n) { for (let i = 0; i < n; i++) this.gems.push({ x: (x + i) * T + T / 2, y: y * T + T / 2, got: false }); return this; }
  slime(x, y = 11) { this.enemies.push({ type: 'slime', x: x * T + 4, y: y * T + T - 18, w: 24, h: 18, vx: -45, vy: 0 }); return this; }
  bee(x, y) { this.enemies.push({ type: 'bee', x: x * T + 5, y: y * T + 8, w: 22, h: 16, baseY: y * T + 8, baseX: x * T + 5, t: Math.random() * 6 }); return this; }
  spikes(x, y, n) { for (let i = 0; i < n; i++) this.set(x + i, y, 'S'); return this; }
  spring(x, y = 11) { this.set(x, y, 'J'); return this; }
  mover(x, y, range, axis = 'x', speed = 1) {
    this.movers.push({ x0: x * T, y0: y * T, x: x * T, y: y * T, w: 2 * T, h: 14, range: range * T, axis, speed, t: 0, dx: 0, dy: 0 }); return this;
  }
  check(x, y = 11) { this.checks.push({ x: x * T, y: y * T, on: false }); return this; }
  pipe(x, y, id) {
    let bottom = y; while (bottom + 1 < H && this.get(x, bottom + 1) !== '#') bottom++;
    for (let yy = y; yy <= bottom; yy++) { this.set(x, yy, 'p'); this.set(x + 1, yy, 'p'); }
    this.pipes.push({ id, x, y, h: bottom - y + 1 }); return this;
  }
  link(a, b) { this.links[a] = b; this.links[b] = a; return this; }
  room(x1, x2) {  // secret room closed with walls and ceiling
    this.rooms.push({ x1, x2 });
    this.col(x1, 0, 14); this.col(x2, 0, 14); this.ground(x1, x2);
    for (let x = x1; x <= x2; x++) { this.set(x, 0, '#'); this.set(x, 1, '#'); }
    return this;
  }
  setStart(x, y = 11) { this.start = { x, y }; return this; }
  setDoor(x, y = 11) { this.door = { x: x * T, y: (y - 1) * T, w: T, h: 2 * T }; return this; }
}

     .room(127, 149).pipe(129, 10, 'b').gemRow(133, 8, 6).gemRow(133, 10, 6).pipe(144, 10, 'c')

}

function startLevel(n) {
  ac();
  levelIndex = n; lvl = buildLevel(n); lives = 3; deaths = 0; time = 0; particles = []; floating = []; shots = []; ammo = 20;
  if (MIL()) {   // bigger tanks/helicopters with health, crates & medkits
    for (const e of lvl.enemies) {
      if (e.type === 'slime') { e.x -= 8; e.y -= 8; e.w = 40; e.h = 26; e.hp = 3; e.vx = -40; }
      else { e.w = 44; e.h = 20; e.hp = 2; }
      e.cool = 1 + Math.random() * 2; e.fireT = 0; e.hitT = 0;
    }
    lvl.gems.forEach((g, i) => { g.med = i % 4 === 2; });
  } else {
    for (const e of lvl.enemies) { e.hp = e.type === 'slime' ? 2 : 1; e.cool = 1.5 + Math.random() * 2; e.fireT = 0; e.hitT = 0; }
  }
  planeTimer = 4;
  respawn = { x: lvl.start.x * T + 6, y: (lvl.start.y + 1) * T - 26 };
  player = newPlayer(respawn.x, respawn.y);
  cam = 0; state = 'play';
  show('hud'); hide('menu'); hide('result'); hide('pause');
  updateHud(); startMusic(skin);
}

// =================== physics helpers ===================
const SOLID = new Set(['#', 'B', 'p', 'J']);
function tileAt(tx, ty) {
  if (tx < 0 || tx >= lvl.W) return '#';
  if (ty < 0 || ty >= H) return '.';
  return lvl.g[ty][tx];
}
const solid = (tx, ty) => SOLID.has(tileAt(tx, ty));
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function moveX(o, dx) {
  o.x += dx;
  const y1 = Math.floor(o.y / T), y2 = Math.floor((o.y + o.h - .01) / T);
  if (dx > 0) {
    const tx = Math.floor((o.x + o.w) / T);
    for (let ty = y1; ty <= y2; ty++) if (solid(tx, ty)) { o.x = tx * T - o.w - .01; return true; }
  } else if (dx < 0) {
    const tx = Math.floor(o.x / T);
    for (let ty = y1; ty <= y2; ty++) if (solid(tx, ty)) { o.x = (tx + 1) * T + .01; return true; }
  }
  return false;
}
function moveY(o, dy) {   // returns tile char hit or null
  o.y += dy;
  const x1 = Math.floor(o.x / T), x2 = Math.floor((o.x + o.w - .01) / T);
  if (dy > 0) {
    const ty = Math.floor((o.y + o.h) / T);
    for (let tx = x1; tx <= x2; tx++) if (solid(tx, ty)) { o.y = ty * T - o.h; return { c: tileAt(tx, ty), down: true }; }
  } else if (dy < 0) {
    const ty = Math.floor(o.y / T);
    for (let tx = x1; tx <= x2; tx++) if (solid(tx, ty)) { o.y = (ty + 1) * T; return { c: tileAt(tx, ty), down: false }; }
  }
  return null;
}

// =================== update ===================
const GRAV = 1900, RUN = 230, JUMP = 660, SPRING = 1020;

function update(dt) {
  clock += dt;
  if (state !== 'play') return;
  const p = player;
  if (p.mode === 'play') time += dt;

  // movers
  for (const m of lvl.movers) {
    m.t += dt * m.speed;
    const off = (Math.sin(m.t) * .5 + .5) * m.range;
    const nx = m.axis === 'x' ? m.x0 + off : m.x0, ny = m.axis === 'y' ? m.y0 + off : m.y0;
    m.dx = nx - m.x; m.dy = ny - m.y; m.x = nx; m.y = ny;
  }

  updateEnemies(dt);
  updateShots(dt);
  if (MIL() && player.mode === 'play') {   // bomber planes fly over every few seconds
    planeTimer -= dt;
    if (planeTimer <= 0) {
      planeTimer = 7 + Math.random() * 4 - levelIndex * 1.5;
      const dir = Math.random() < .5 ? 1 : -1, y = 40 + Math.random() * 60;
      lvl.enemies.push({ type: 'plane', x: dir > 0 ? cam - 140 : cam + VIEW_W + 80, y, baseY: y, w: 54, h: 20, vx: dir * 150, face: dir, hp: 2, cool: .6, fireT: 0, hitT: 0, t: 0 });
      SND.plane();
    }
    lvl.enemies = lvl.enemies.filter(e => !e.gone);
  }
  updateParticles(dt);

  if (p.mode === 'dead') {
    p.t += dt; p.vy += GRAV * dt; p.y += p.vy * dt;
    if (p.t > 1.3) {
      if (lives <= 0) return finishLevel(false);
      player = newPlayer(respawn.x, respawn.y); player.inv = 1.5; shots = shots.filter(q => q.kind === 'pbullet'); ammo = Math.max(ammo, 10); cam = clampCam(player.x - VIEW_W / 2);
    }
    return;
  }
  if (p.mode === 'pipeIn') {
    p.t += dt; p.y += 70 * dt;
    if (p.t > .5) {
      const dest = p.pipeTo;
      p.x = dest.x * T + T - p.w / 2; p.y = dest.y * T + 2; p.mode = 'pipeOut'; p.t = 0;
      cam = clampCam(p.x - VIEW_W / 2);
    }
    return;
  }
  if (p.mode === 'pipeOut') {
    p.t += dt; p.y -= 70 * dt;
    if (p.y + p.h <= p.pipeTo.y * T) { p.y = p.pipeTo.y * T - p.h; p.mode = 'play'; p.vy = 0; respawn = { x: p.x, y: p.y }; }
    return;
  }
  if (p.mode === 'win') { p.t += dt; if (p.t > 1.2) finishLevel(true); return; }

  // input
  const left = keys.ArrowLeft || keys.KeyA || keys.TouchLeft, right = keys.ArrowRight || keys.KeyD || keys.TouchRight;
  const jumpHeld = keys.Space || keys.ArrowUp || keys.KeyW;
  const target = (p.sliding > 0) ? 0 : (right ? 1 : 0) - (left ? 1 : 0);
  const accel = p.onGround ? 1800 : 1100;
  if (target) { p.vx += target * accel * dt; p.face = target; }
  else { const f = (p.onGround ? 1600 : 500) * dt; p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f; }
  if (!(p.sliding > 0)) p.vx = Math.max(-RUN, Math.min(RUN, p.vx));

  p.coyote = p.onGround ? .1 : p.coyote - dt;
  p.jumpBuf -= dt;
  if (p.jumpBuf > 0 && p.coyote > 0) { p.vy = -JUMP; p.jumpBuf = 0; p.coyote = 0; p.onGround = false; p.jumping = true; p.ride = null; SND.jump(); }
  if (p.vy >= 0) p.jumping = false;
  if (!jumpHeld && p.jumping && p.vy < -280) p.vy = -280;   // short hop when tapping

  // pipe enter
  if ((keys.ArrowDown || keys.KeyS) && p.onGround) {
    const cx = p.x + p.w / 2;
    for (const pp of lvl.pipes) {
      if (Math.abs(p.y + p.h - pp.y * T) < 2 && cx > pp.x * T + 6 && cx < pp.x * T + 2 * T - 6) {
        const destId = lvl.links[pp.id], dest = lvl.pipes.find(q => q.id === destId);
        if (dest) { p.mode = 'pipeIn'; p.t = 0; p.pipeTo = dest; p.vx = 0; p.x = pp.x * T + T - p.w / 2; SND.pipe(); return; }
      }
    }
  }

  // military: slide (down while running) and shooting
  if (MIL()) {
    const down = keys.ArrowDown || keys.KeyS;
    if (down && p.onGround && !(p.sliding > 0) && Math.abs(p.vx) > 60) {
      p.sliding = .6; p.slideDir = Math.sign(p.vx); p.y += 12; p.h = 14; SND.slide();
    }
    if (p.sliding > 0) {
      p.sliding -= dt;
      p.vx = p.slideDir * (120 + 260 * Math.max(0, p.sliding) / .6);
      if (Math.random() < .5) particles.push({ x: p.x + p.w / 2 - p.slideDir * 8, y: p.y + p.h, vx: -p.slideDir * 40, vy: -40, life: .35, color: '#c99a66' });
      if (p.sliding <= 0 || (p.jumpBuf > 0)) endSlide(p);
    }
  }
  {   // shooting (all styles)
    p.fireCool = (p.fireCool || 0) - dt; p.fireT = (p.fireT || 0) - dt;
    if ((keys.KeyX || keys.KeyF || keys.KeyJ || keys.TouchFire) && p.fireCool <= 0) {
      p.fireCool = .22;
      if (ammo > 0) {
        ammo--; p.fireT = .1; SND.shoot();
        shots.push(aimShot(p));
        updateHud();
      } else { SND.empty(); p.fireCool = .4; float(p.x + 10, p.y - 12, lang === 'ar' ? 'مفيش ذخيرة!' : 'No ammo!'); }
    }
  }

  // ride mover
  if (p.ride) { moveX(p, p.ride.dx); p.y = p.ride.y - p.h; }

  p.vy = Math.min(p.vy + GRAV * dt, 950);
  if (moveX(p, p.vx * dt)) p.vx = 0;
  const prevBottom = p.y + p.h;
  const hit = moveY(p, p.vy * dt);
  p.onGround = false;
  if (hit) {
    if (hit.down) {
      if (hit.c === 'J') { p.vy = -SPRING; SND.spring(); puff(p.x + p.w / 2, p.y + p.h, '#ff5a5a', 8); }
      else { p.vy = 0; p.onGround = true; }
    } else p.vy = 0;
  }
  p.ride = null;
  if (p.vy >= 0) {
    for (const m of lvl.movers) {
      if (p.x + p.w > m.x + 2 && p.x < m.x + m.w - 2 && prevBottom <= m.y + 2 + Math.max(0, m.dy) && p.y + p.h >= m.y) {
        p.y = m.y - p.h; p.vy = 0; p.onGround = true; p.ride = m;
      }
    }
  }

  p.anim += Math.abs(p.vx) * dt * .06;
  if (p.inv > 0) p.inv -= dt;

  // fall off
  if (p.y > H * T + 40) return die();

  // spikes
  const box = { x: p.x + 3, y: p.y + 4, w: p.w - 6, h: p.h - 4 };
  for (let ty = Math.floor(box.y / T); ty <= Math.floor((box.y + box.h) / T); ty++)
    for (let tx = Math.floor(box.x / T); tx <= Math.floor((box.x + box.w) / T); tx++)
      if (tileAt(tx, ty) === 'S' && overlap(box, { x: tx * T + 4, y: ty * T + 16, w: T - 8, h: 16 })) { if (p.inv <= 0) { hurt(); p.vy = -520; } }

  // gems
  for (const g of lvl.gems) {
    if (!g.got && Math.abs(p.x + p.w / 2 - g.x) < 20 && Math.abs(p.y + p.h / 2 - g.y) < 22) {
      g.got = true; SND.gem(); puff(g.x, g.y, g.med ? '#ff5a5a' : SKINS[skin].gemColor, 8);
      if (MIL()) {
        if (g.med) { lives = Math.min(5, lives + 1); float(g.x, g.y - 14, '+❤️'); }
        else { ammo += 5; float(g.x, g.y - 14, '+5'); }
      } else { ammo += 3; float(g.x, g.y - 14, '+3'); }
      updateHud();
    }
  }
  // checkpoints
  for (const c of lvl.checks) {
    if (!c.on && Math.abs(p.x - c.x) < 24) { c.on = true; respawn = { x: c.x + 6, y: c.y + T - p.h }; SND.check(); float(c.x + 16, c.y - 30, '✔'); }
  }
  // enemies
  for (const e of lvl.enemies) {
    if (e.dead || !overlap(p, e)) continue;
    if (p.vy > 40 && prevBottom - e.y < 14) {
      e.dead = true; e.deadT = 0; p.vy = keys.Space || keys.ArrowUp || keys.KeyW ? -620 : -420;
      SND.stomp(); puff(e.x + e.w / 2, e.y + e.h / 2, e.type === 'bee' ? '#ffd23f' : '#b072ff', 10); float(e.x, e.y - 10, '+');
    } else if (p.inv <= 0) { hurt(); if (p.mode !== 'play') return; }
  }
  // projectiles
  {
    const hb = { x: p.x + 3, y: p.y + 2, w: p.w - 6, h: p.h - 2 };
    for (const q of shots) {
      if (q.kind === 'pbullet') continue;
      if (q.x > hb.x - 3 && q.x < hb.x + hb.w + 3 && q.y > hb.y - 3 && q.y < hb.y + hb.h + 3 && p.inv <= 0) { q.life = 0; puff(q.x, q.y, '#ffb347', 10); hurt(); if (p.mode !== 'play') return; }
    }
  }
  // door
  if (lvl.door && overlap(p, lvl.door)) { p.mode = 'win'; p.t = 0; p.vx = 0; SND.win(); for (let i = 0; i < 4; i++) puff(lvl.door.x + 16, lvl.door.y + 20, ['#ffd23f', '#00f3ff', '#ff6fb5'][i % 3], 12); }

  cam += (clampCam(p.x + p.w / 2 - VIEW_W / 2 + p.face * 60) - cam) * Math.min(1, dt * 6);
  updateHud();
}

function clampCam(x) { return Math.max(0, Math.min(lvl.W * T - VIEW_W, x)); }

function updateEnemies(dt) {
  for (const e of lvl.enemies) {
    if (e.dead) { e.deadT += dt; if (e.type === 'plane') { e.y += 140 * dt; e.x += e.vx * .5 * dt; if (e.deadT > 1) e.gone = true; } continue; }
    enemyFire(e, dt);
    if (e.type === 'slime') {
      e.vy = Math.min(e.vy + GRAV * dt, 900);
      if (moveX(e, e.vx * dt)) e.vx *= -1;
      const hit = moveY(e, e.vy * dt);
      if (hit && hit.down) {
        e.vy = 0;
        const front = e.vx > 0 ? e.x + e.w + 2 : e.x - 2;   // turn at ledges and spikes
        const tx = Math.floor(front / T), ty = Math.floor((e.y + e.h + 4) / T);
        if (!solid(tx, ty) || tileAt(tx, ty - 1) === 'S') e.vx *= -1;
      }
      if (e.y > H * T) e.dead = true;
    } else if (e.type === 'plane') {
      e.t += dt; e.x += e.vx * dt; e.y = e.baseY + Math.sin(e.t * 2) * 6;
      if (e.x < cam - 400 || e.x > cam + VIEW_W + 400) { e.dead = true; e.gone = true; }
    } else {
      e.t += dt; e.y = e.baseY + Math.sin(e.t * 2.2) * 34; e.x = e.baseX + Math.sin(e.t * .9) * 26;
    }
  }
}

function endSlide(p) {
  const x1 = Math.floor((p.x + 1) / T), x2 = Math.floor((p.x + p.w - 1) / T), ty = Math.floor((p.y - 12) / T);
  if (solid(x1, ty) || solid(x2, ty)) { p.sliding = .05; return; }   // no room to stand yet
  p.sliding = 0; p.y -= 12; p.h = 26;
}

function updateShots(dt) {
  const mil = MIL();
  for (const q of shots) {
    q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;
    if (q.kind === 'shell') q.vy += 40 * dt;
    if (q.kind === 'bomb') q.vy += 520 * dt;
    if (solid(Math.floor(q.x / T), Math.floor(q.y / T))) {
      q.life = 0; puff(q.x, q.y, '#ffb347', 6);
      if (q.kind === 'bomb') {
        SND.boom(); puff(q.x, q.y - 6, '#ff8c2a', 16); puff(q.x, q.y - 6, '#3a3030', 10);
        const p = player; if (Math.hypot(p.x + p.w / 2 - q.x, p.y + p.h / 2 - q.y) < 40) hurt();
      }
      continue;
    }
    if (q.kind === 'pbullet') {
      for (const o of shots) {   // shoot down incoming shells and bullets
        if (o.kind !== 'pbullet' && o.life > 0 && Math.abs(o.x - q.x) < 10 && Math.abs(o.y - q.y) < 9) { o.life = 0; q.life = 0; puff(o.x, o.y, '#ffb347', 8); SND.hit(); }
      }
      if (q.life <= 0) continue;
      for (const e of lvl.enemies) {
        if (e.dead || q.x < e.x || q.x > e.x + e.w || q.y < e.y - 4 || q.y > e.y + e.h) continue;
        q.life = 0; e.hp = (e.hp || 1) - 1; e.hitT = .12; puff(q.x, q.y, '#ffe066', 5);
        if (e.hp <= 0) { e.dead = true; e.deadT = 0; mil ? SND.boom() : SND.stomp(); puff(e.x + e.w / 2, e.y + e.h / 2, '#ff8c2a', 18); puff(e.x + e.w / 2, e.y + e.h / 2, '#3a3030', 10); float(e.x + e.w / 2, e.y - 10, '💥'); }
        else SND.hit();
        break;
      }
    }
  }
  shots = shots.filter(q => q.life > 0 && q.x > cam - 200 && q.x < cam + VIEW_W + 200 && q.y < H * T + 40 && q.y > -120);
}

function enemyFire(e, dt) {
  const mil = MIL();
  e.cool -= dt; e.fireT = Math.max(0, e.fireT - dt); e.hitT = Math.max(0, (e.hitT || 0) - dt);
  const p = player; if (!p || p.mode !== 'play') return;
  const dx = (p.x + p.w / 2) - (e.x + e.w / 2);
  if (e.type === 'slime') {
    if (Math.abs(dx) < 140) e.face = Math.sign(dx) || e.face;
    else e.face = Math.sign(e.vx) || e.face;
    if (e.cool <= 0 && Math.abs(dx) < (mil ? 430 : 340) && Math.abs((p.y + p.h) - (e.y + e.h)) < 50) {
      e.face = Math.sign(dx) || 1; e.cool = (mil ? 2.6 : 3.2) + Math.random() * 1.4; e.fireT = .25; mil ? SND.cannon() : SND.spit();
      shots.push(mil ? { kind: 'shell', x: e.x + e.w / 2 + e.face * 38, y: e.y + e.h - 21, vx: e.face * 190, vy: 0, life: 3.5 }
                     : { kind: 'shell', x: e.x + e.w / 2 + e.face * 14, y: e.y + e.h / 2 - 2, vx: e.face * 160, vy: 0, life: 3 });
    }
  } else if (e.type === 'plane') {
    const dy = (p.y + p.h / 2) - (e.y + e.h / 2);
    if (e.cool <= 0 && Math.abs(dx) < 70 && dy > 0) {
      e.cool = .9 + Math.random() * .5; SND.bombDrop();
      shots.push({ kind: 'bomb', x: e.x + e.w / 2, y: e.y + e.h, vx: e.vx * .35, vy: 20, life: 4 });
    }
  } else {
    e.face = Math.cos(e.t * .9) >= 0 ? 1 : -1;
    const dy = (p.y + p.h / 2) - (e.y + e.h / 2);
    if (e.cool <= 0 && Math.abs(dx) < 300 && dy > 20) {
      e.cool = (mil ? 1.8 : 2.8) + Math.random(); mil ? SND.mg() : SND.spit();
      const tx = dx + (Math.random() - .5) * 70, d = Math.hypot(tx, dy) || 1;   // warning fire: a little off-target
      shots.push({ kind: 'bullet', x: e.x + e.w / 2, y: e.y + e.h, vx: tx / d * 200, vy: dy / d * 200, life: 3 });
    }
  }
}

function hurt() {   // lose one heart, blink, keep going
  const p = player; if (p.mode !== 'play' || p.inv > 0) return;
  lives--; deaths++; SND.hurt(); updateHud();
  float(p.x + 10, p.y - 14, '-1 ❤️');
  if (lives <= 0) { p.mode = 'dead'; p.t = 0; p.vy = -520; return; }
  p.inv = 1.6; p.vy = -330; p.vx = -p.face * 160; p.ride = null; p.jumping = false;
  if (p.sliding > 0) endSlide(p);
}

function aimShot(p) {   // aims up at planes / helicopters / bombs in front, otherwise straight ahead
  const sx = p.x + p.w / 2 + p.face * 14, sy = p.y + (p.sliding > 0 ? p.h - 9 : 14), v = 560;
  let best = null, bd = 470;
  const targets = lvl.enemies.filter(e => !e.dead && (e.type === 'bee' || e.type === 'plane')).map(e => ({ x: e.x + e.w / 2, y: e.y + e.h / 2, vx: e.vx || 0 }))
    .concat(shots.filter(o => o.kind === 'bomb').map(o => ({ x: o.x, y: o.y, vx: o.vx })));
  for (const c of targets) {
    let dx = c.x - sx, dy = c.y - sy, d = Math.hypot(dx, dy);
    if (dy > -26 || dx * p.face < -70 || d > bd) continue;
    dx += c.vx * (d / v); d = Math.hypot(dx, dy);   // lead moving targets
    best = { dx, dy, d }; bd = d;
  }
  if (best) return { kind: 'pbullet', x: sx, y: sy, vx: best.dx / best.d * v, vy: best.dy / best.d * v, life: 1.1 };
  return { kind: 'pbullet', x: sx, y: sy, vx: p.face * v, vy: 0, life: 1 };
}

function die() {
  const p = player; if (p.mode === 'dead') return;
  p.mode = 'dead'; p.t = 0; p.vy = -520; lives--; deaths++; SND.hurt(); updateHud();
}

function puff(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 160;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: .6 + Math.random() * .3, color });
  }
}
function float(x, y, text) { floating.push({ x, y, text, life: .8 }); }
function updateParticles(dt) {
  particles = particles.filter(q => { q.life -= dt; q.vy += 600 * dt; q.x += q.vx * dt; q.y += q.vy * dt; return q.life > 0; });
  floating = floating.filter(f => { f.life -= dt; f.y -= 50 * dt; return f.life > 0; });
}

// =================== results ===================
function finishLevel(won) {
  state = 'result';
  const gt = lvl.gems.length, g = lvl.gems.filter(x => x.got).length, secs = Math.round(time);
  let stars = 0, record = false;
  if (won) {
    stars = 1 + (g === gt ? 1 : 0) + (secs <= PAR[levelIndex] ? 1 : 0);
    const prev = progress.best[levelIndex];
    if (!prev || stars > prev.stars || (stars === prev.stars && secs < prev.time)) { progress.best[levelIndex] = { stars, time: secs }; record = true; }
    progress.unlocked = Math.max(progress.unlocked, Math.min(3, levelIndex + 2));
    saveProgress();
  }
  document.getElementById('rTitle').textContent = won ? (levelIndex === 2 ? L().done : L().win) : L().lose;
  document.getElementById('rStars').textContent = won ? '⭐'.repeat(stars) + '☆'.repeat(3 - stars) : '💔';
  document.getElementById('rInfo').innerHTML = (won ? L().info(num(g), num(gt), num(secs), num(deaths)) + '<br>' + L().starHelp : '') + (won && record ? '<br><b>' + L().record + '</b>' : '');
  const nb = document.getElementById('rNext');
  nb.textContent = L().next; nb.classList.toggle('hidden', !won || levelIndex === 2);
  hide('hud'); show('result');
}

// =================== drawing (neon / synthwave) ===================
const CYAN = '#00f3ff', PINK = '#ff007f';

// small seeded random so the city looks the same every time
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function offscreen(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// circuit-board texture for the ground
const circuitPattern = (() => {
  const c = offscreen(128, 128), g = c.getContext('2d'), r = rng(7);
  g.fillStyle = '#0c0a22'; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = 'rgba(60, 120, 255, .28)'; g.fillStyle = 'rgba(80, 150, 255, .4)'; g.lineWidth = 1.4;
  for (let i = 0; i < 14; i++) {
    let x = Math.round(r() * 8) * 16, y = Math.round(r() * 8) * 16;
    g.beginPath(); g.moveTo(x, y);
    for (let s = 0; s < 3; s++) {
      const len = 8 + Math.round(r() * 3) * 8, d = Math.floor(r() * 3);
      if (d === 0) x += len; else if (d === 1) y += len; else { x += len * .7; y += len * .7; }
      g.lineTo(x, y);
    }
    g.stroke();
    g.beginPath(); g.arc(x, y, 2.4, 0, 7); g.fill();
  }
  g.fillStyle = 'rgba(60, 120, 255, .18)';
  for (let i = 0; i < 6; i++) g.fillRect(Math.floor(r() * 7) * 16 + 3, Math.floor(r() * 7) * 16 + 3, 10, 6);   // tiny chips
  return ctx.createPattern(c, 'repeat');
})();

// futuristic skylines (far = dim silhouettes, near = lit windows)
function makeSkyline(seed, w, h, near) {
  const c = offscreen(w, h), g = c.getContext('2d'), r = rng(seed);
  let x = 0;
  while (x < w) {
    const bw = near ? 46 + r() * 70 : 30 + r() * 60, bh = near ? 90 + r() * 200 : 120 + r() * 170, top = h - bh;
    const grad = g.createLinearGradient(0, top, 0, h);
    grad.addColorStop(0, near ? '#1d1240' : '#24164a'); grad.addColorStop(1, near ? '#0b0620' : '#140b30');
    g.fillStyle = grad; g.fillRect(x, top, bw, bh);
    if (r() < .5) { g.fillRect(x + bw / 2 - 1.5, top - 26, 3, 26); g.fillStyle = PINK; g.fillRect(x + bw / 2 - 2, top - 30, 4, 4); }
    if (near) {
      g.strokeStyle = 'rgba(0, 243, 255, .35)'; g.lineWidth = 1; g.strokeRect(x + .5, top + .5, bw - 1, bh);
      for (let wy = top + 10; wy < h - 10; wy += 11)
        for (let wx = x + 6; wx < x + bw - 6; wx += 9)
          if (r() < .3) { g.fillStyle = r() < .65 ? 'rgba(0,243,255,.85)' : 'rgba(255,0,127,.85)'; g.fillRect(wx, wy, 4, 6); }
      if (r() < .3) { g.fillStyle = r() < .5 ? CYAN : PINK; g.shadowColor = g.fillStyle; g.shadowBlur = 10; g.fillRect(x + 6, top + 18, bw - 12, 4); g.shadowBlur = 0; }
    } else {
      for (let wy = top + 12; wy < h; wy += 16) for (let wx = x + 5; wx < x + bw - 5; wx += 10)
        if (r() < .12) { g.fillStyle = 'rgba(140,110,255,.45)'; g.fillRect(wx, wy, 3, 4); }
    }
    x += bw + (near ? 4 + r() * 18 : r() * 8);
  }
  return c;
}
const skyFar = makeSkyline(11, 1600, 330, false), skyNear = makeSkyline(29, 1800, 300, true);

const NEON_THEMES = [   // sun colour changes per level
  { sun: ['#ffffff', '#9ffcff', '#00f3ff'], glow: CYAN, cloud: '#ff3df2' },
  { sun: ['#ffffff', '#ffc6ec', '#ff007f'], glow: PINK, cloud: '#ff3df2' },
  { sun: ['#ffffff', '#ddc8ff', '#9d4dff'], glow: '#b26bff', cloud: CYAN },
];

function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
function noGlow() { ctx.shadowBlur = 0; }

function neonBg(li) {
  const th = NEON_THEMES[li];
  const sky = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  sky.addColorStop(0, '#1a0b2e'); sky.addColorStop(1, '#090514');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // stars
  for (let i = 0; i < 60; i++) {
    const sx = ((i * 157 - cam * .05) % VIEW_W + VIEW_W) % VIEW_W, sy = (i * 53) % 230;
    ctx.globalAlpha = .25 + .5 * Math.abs(Math.sin(clock * 1.5 + i)); ctx.fillStyle = i % 4 ? '#cfc6ff' : CYAN; ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.globalAlpha = 1;

  // sun with rays
  const sx = 770, sy = 100;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 12; i++) {
    const a = clock * .05 + i * Math.PI / 6 + Math.PI / 2.4;
    ctx.fillStyle = `rgba(${i % 2 ? '255,0,127' : '0,243,255'},.07)`;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(a - .06) * 700, sy + Math.sin(a - .06) * 700); ctx.lineTo(sx + Math.cos(a + .06) * 700, sy + Math.sin(a + .06) * 700); ctx.fill();
  }
  const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 150);
  sg.addColorStop(0, th.sun[0]); sg.addColorStop(.25, th.sun[1]); sg.addColorStop(.5, th.sun[2] + '88'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 150, 0, 7); ctx.fill();
  ctx.restore();

  tiled(skyFar, .08, VIEW_H - 330 - 40);
  for (let i = 0; i < 5; i++) {   // dark clouds with glowing edges
    const x = ((i * 330 - cam * .15 + clock * 6) % 1650 + 1650) % 1650 - 200, y = 70 + (i % 3) * 55;
    neonCloud(x, y, .8 + (i % 2) * .4, i % 2 ? th.cloud : CYAN);
  }
  tiled(skyNear, .22, VIEW_H - 300 - 20);
  neonHills('#120826', .45, 360, 40, .008);

}

function tiled(img, par, y) {
  const off = -((cam * par) % img.width);
  for (let x = off; x < VIEW_W; x += img.width) ctx.drawImage(img, x, y);
}
function neonCloud(x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath();
  ctx.ellipse(0, 0, 70, 20, 0, 0, 7); ctx.ellipse(-30, -14, 34, 22, 0, 0, 7); ctx.ellipse(18, -24, 40, 28, 0, 0, 7); ctx.ellipse(55, -8, 28, 18, 0, 0, 7);
  glow(color, 18); ctx.fillStyle = '#1e0f3d'; ctx.fill();
  noGlow(); ctx.globalAlpha = .55; ctx.fillStyle = '#2a1552'; ctx.fill(); ctx.globalAlpha = 1;
  ctx.restore();
}
function neonHills(color, par, base, amp, freq) {
  ctx.beginPath(); ctx.moveTo(0, VIEW_H);
  for (let x = 0; x <= VIEW_W; x += 12) { const wx = x + cam * par; ctx.lineTo(x, base - amp * (Math.sin(wx * freq) * .6 + Math.sin(wx * freq * 2.3 + 1) * .4)); }
  ctx.lineTo(VIEW_W, VIEW_H);
  ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = 'rgba(178,107,255,.45)'; ctx.lineWidth = 2; glow('#b26bff', 10); ctx.stroke(); noGlow();
}

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

function neonTiles(x1, x2) {
  const groundTop = new Path2D(), groundSide = new Path2D(), platTop = new Path2D(), spikes = new Path2D();
  ctx.fillStyle = circuitPattern;
  for (let ty = 0; ty < H; ty++) for (let tx = x1; tx <= x2; tx++) {
    const c = tileAt(tx, ty), x = tx * T, y = ty * T;
    if (c === '#') {
      ctx.fillStyle = circuitPattern; ctx.fillRect(x, y, T, T);
      if (tileAt(tx, ty - 1) !== '#') {
        groundTop.moveTo(x, y + 2); groundTop.lineTo(x + T, y + 2);
        ctx.fillStyle = 'rgba(0,243,255,.08)'; ctx.fillRect(x, y, T, 12);
        ctx.strokeStyle = '#2a1b55'; ctx.lineWidth = 2; ctx.beginPath();   // dark grass blades
        for (let i = 0; i < 3; i++) { const bx = x + 5 + ((tx * 7 + i * 11) % 24); ctx.moveTo(bx, y); ctx.lineTo(bx + (i - 1) * 2, y - 5 - ((tx + i) % 3) * 2); }
        ctx.stroke();
      }
      if (tileAt(tx - 1, ty) !== '#' && tx > 0) { groundSide.moveTo(x + 1, y); groundSide.lineTo(x + 1, y + T); }
      if (tileAt(tx + 1, ty) !== '#' && tx < lvl.W - 1) { groundSide.moveTo(x + T - 1, y); groundSide.lineTo(x + T - 1, y + T); }
    } else if (c === 'B') {
      ctx.fillStyle = '#150d2e'; rr(x + 1, y + 1, T - 2, T - 2, 4); ctx.fill();
      ctx.strokeStyle = 'rgba(255,0,127,.35)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = 'rgba(255,0,127,.25)'; ctx.fillRect(x + 8, y + 14, T - 16, 2); ctx.fillRect(x + 12, y + 20, T - 24, 2);
      if (tileAt(tx, ty - 1) !== 'B') { platTop.moveTo(x + 1, y + 2); platTop.lineTo(x + T - 1, y + 2); }
    } else if (c === 'S') {
      for (let i = 0; i < 3; i++) { spikes.moveTo(x + 2 + i * 10, y + T); spikes.lineTo(x + 7 + i * 10, y + 14); spikes.lineTo(x + 12 + i * 10, y + T); spikes.closePath(); }
    } else if (c === 'J') {
      ctx.fillStyle = '#150d2e'; ctx.fillRect(x + 4, y + T - 8, T - 8, 8);
      glow(CYAN, 8); ctx.strokeStyle = CYAN; ctx.lineWidth = 2.5; ctx.beginPath();
      const sq = Math.sin(clock * 8) * 1.5;
      for (let i = 0; i < 4; i++) { ctx.moveTo(x + 8, y + T - 10 - i * (5 + sq * .3)); ctx.lineTo(x + T - 8, y + T - 13 - i * (5 + sq * .3)); }
      ctx.stroke();
      glow(PINK, 14); ctx.fillStyle = PINK; rr(x + 2, y + 6 - sq, T - 4, 6, 3); ctx.fill(); noGlow();
    }
  }

  ctx.lineCap = 'round';
  glow(CYAN, 8); ctx.strokeStyle = 'rgba(0,243,255,.55)'; ctx.lineWidth = 2; ctx.stroke(groundSide);
  glow(CYAN, 18); ctx.strokeStyle = CYAN; ctx.lineWidth = 5; ctx.stroke(groundTop);
  noGlow(); ctx.strokeStyle = '#d8ffff'; ctx.lineWidth = 1.5; ctx.stroke(groundTop);
  glow(PINK, 16); ctx.strokeStyle = PINK; ctx.lineWidth = 4; ctx.stroke(platTop);
  glow(PINK, 12); ctx.fillStyle = '#3a0a2c'; ctx.fill(spikes); ctx.strokeStyle = '#ff4fa3'; ctx.lineWidth = 2; ctx.stroke(spikes);
  noGlow(); ctx.lineCap = 'butt';
}

function neonRoom(r) {   // secret room: dark tech wall with a faint grid
  const rx = (r.x1 + 1) * T, rw = (r.x2 - r.x1 - 1) * T, ry = 2 * T, rh = 10 * T;
  ctx.fillStyle = '#0a0618'; ctx.fillRect(rx, ry, rw, rh);
  ctx.strokeStyle = 'rgba(178,107,255,.16)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = rx; x <= rx + rw; x += T) { ctx.moveTo(x, ry); ctx.lineTo(x, ry + rh); }
  for (let y = ry; y <= ry + rh; y += T) { ctx.moveTo(rx, y); ctx.lineTo(rx + rw, y); }
  ctx.stroke();
  ctx.font = 'bold 26px "Baloo Bhaijaan 2", sans-serif'; ctx.textAlign = 'center';
  glow(PINK, 16); ctx.fillStyle = '#ff9bd0'; ctx.fillText(lang === 'ar' ? '✦ غرفة سرية ✦' : '✦ SECRET ROOM ✦', rx + rw / 2, ry + 40); noGlow();
}

function neonPipe(pp) {
  const x = pp.x * T, y = pp.y * T, w = 2 * T, h = pp.h * T;
  if (x + w < cam - 20 || x > cam + VIEW_W + 20) return;
  const metal = (a, b) => {
    const g = ctx.createLinearGradient(a, 0, b, 0);
    g.addColorStop(0, '#2b3557'); g.addColorStop(.22, '#9fb3dc'); g.addColorStop(.38, '#f2f7ff'); g.addColorStop(.6, '#7f95c4'); g.addColorStop(1, '#1d2440');
    return g;

  const pulse = .6 + .4 * Math.sin(clock * 3 + pp.x);
  glow(CYAN, 14 * pulse); ctx.fillStyle = CYAN;
  for (let ry = y + 26; ry < y + h - 6; ry += 22) ctx.fillRect(x + 5, ry, w - 10, 3);
  noGlow();

  ctx.fillStyle = metal(x, x + w); rr(x, y + 2, w, 14, 3); ctx.fill();
  glow(CYAN, 12); ctx.strokeStyle = 'rgba(0,243,255,.9)'; ctx.lineWidth = 1.5; ctx.stroke(); noGlow();
  ctx.fillStyle = '#05030d'; ctx.beginPath(); ctx.ellipse(x + w / 2, y + 3, w / 2 - 4, 4, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(0,243,255,.6)'; ctx.lineWidth = 1; ctx.stroke();
}

function neonMover(m) {
  ctx.fillStyle = '#150d2e'; rr(m.x, m.y, m.w, m.h, 5); ctx.fill();
  glow(CYAN, 14); ctx.strokeStyle = CYAN; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(m.x + 3, m.y + 2); ctx.lineTo(m.x + m.w - 3, m.y + 2); ctx.stroke();
  glow(PINK, 10); ctx.fillStyle = PINK; ctx.beginPath(); ctx.arc(m.x + 10, m.y + 9, 2.5, 0, 7); ctx.arc(m.x + m.w - 10, m.y + 9, 2.5, 0, 7); ctx.fill(); noGlow();
}

function neonGem(g) {
  const pulse = 1 + Math.sin(clock * 4 + g.x * .05) * .08, bob = Math.sin(clock * 3 + g.x) * 3;
  ctx.save(); ctx.translate(g.x, g.y + bob); ctx.scale(pulse, pulse);
  glow(CYAN, 14 + 8 * Math.sin(clock * 4 + g.x));
  ctx.fillStyle = '#00e1f0'; ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(9, -2); ctx.lineTo(0, 12); ctx.lineTo(-9, -2); ctx.closePath(); ctx.fill();
  noGlow();

  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-9, -2); ctx.lineTo(9, -2); ctx.stroke();

}

function neonCheck(c) {
  ctx.fillStyle = '#2a2350'; ctx.fillRect(c.x + 14, c.y - 30, 4, 62);
  const col = c.on ? CYAN : '#6a5a9a', wave = Math.sin(clock * 6) * 3;

  ctx.beginPath(); ctx.moveTo(c.x + 18, c.y - 30); ctx.lineTo(c.x + 42, c.y - 22 + wave); ctx.lineTo(c.x + 18, c.y - 12); ctx.fill();
  ctx.beginPath(); ctx.arc(c.x + 16, c.y - 32, 4, 0, 7); ctx.fill(); noGlow();
}

function star(cx, cy, r1, r2) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? r2 : r1; ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
  ctx.closePath();
}

function neonDoor(d) {   // futuristic capsule portal topped by a glowing star
  const cx = d.x + d.w / 2, top = d.y - 6, w = 46, h = d.h + 6, pulse = .5 + .5 * Math.sin(clock * 3);
  const g = ctx.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
  g.addColorStop(0, '#1b1f3d'); g.addColorStop(.35, '#59648f'); g.addColorStop(.5, '#a9b6dc'); g.addColorStop(.7, '#4b557d'); g.addColorStop(1, '#141830');
  ctx.fillStyle = g; rr(cx - w / 2, top, w, h, [18, 18, 4, 4]); ctx.fill();
  glow(CYAN, 16); ctx.strokeStyle = CYAN; ctx.lineWidth = 2; ctx.stroke();
  // inner glowing chamber
  ctx.fillStyle = `rgba(0,243,255,${.25 + .25 * pulse})`; rr(cx - 13, top + 12, 26, h - 20, [12, 12, 3, 3]); ctx.fill();
  ctx.fillStyle = '#bffcff'; rr(cx - 3, top + 20, 6, h - 36, 3); ctx.fill();
  noGlow();
  ctx.fillStyle = '#0d1030'; ctx.fillRect(cx - w / 2 - 4, d.y + d.h - 6, w + 8, 6);
  // orb + star
  const oy = top - 26 + Math.sin(clock * 2.5) * 3;
  const og = ctx.createRadialGradient(cx, oy, 2, cx, oy, 24);
  og.addColorStop(0, 'rgba(0,243,255,.55)'); og.addColorStop(1, 'rgba(0,243,255,0)');
  ctx.fillStyle = og; ctx.beginPath(); ctx.arc(cx, oy, 24, 0, 7); ctx.fill();
  glow(CYAN, 22); ctx.fillStyle = '#7ffaff'; star(cx, oy, 13, 5.5); ctx.fill();
  noGlow(); ctx.fillStyle = '#ffffff'; star(cx, oy, 6, 2.5); ctx.fill();

function neonEnemy(e) {
  if (e.dead && (e.deadT > .5 || e.type === 'slime' && e.y > H * T)) return;
  ctx.save();
  if (e.dead) ctx.globalAlpha = Math.max(0, 1 - e.deadT * 2);
  if (e.type === 'slime') {
    const sq = e.dead ? .35 : 1 + Math.sin(clock * 10 + e.x) * .08;
    const w = e.w * (e.dead ? 1.4 : 1 / sq), h = e.h * sq, cx = e.x + e.w / 2, by = e.y + e.h;
    glow('#c04dff', 14); ctx.fillStyle = '#8a2be2'; ctx.beginPath(); ctx.ellipse(cx, by - h / 2, w / 2 + 2, h / 2 + 1, 0, 0, 7); ctx.fill(); noGlow();
    ctx.strokeStyle = '#e09bff'; ctx.lineWidth = 1.5; ctx.stroke();
    if (!e.dead) {
      const dir = Math.sign(e.vx);
      glow(PINK, 8); ctx.fillStyle = '#ff5fb0';
      ctx.beginPath(); ctx.arc(cx - 5 + dir * 2, by - h * .55, 3.5, 0, 7); ctx.arc(cx + 5 + dir * 2, by - h * .55, 3.5, 0, 7); ctx.fill(); noGlow();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx - 5 + dir * 3, by - h * .58, 1.3, 0, 7); ctx.arc(cx + 5 + dir * 3, by - h * .58, 1.3, 0, 7); ctx.fill();
      ctx.strokeStyle = '#1a0b2e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx - 9, by - h * .82); ctx.lineTo(cx - 2, by - h * .7); ctx.moveTo(cx + 9, by - h * .82); ctx.lineTo(cx + 2, by - h * .7); ctx.stroke();
    }

    const cx = e.x + e.w / 2, cy = e.y + e.h / 2, flap = Math.sin(clock * 40) * 4;
    ctx.fillStyle = 'rgba(160,240,255,.55)'; ctx.beginPath(); ctx.ellipse(cx - 3, cy - 9 - flap, 6, 4, -.4, 0, 7); ctx.ellipse(cx + 4, cy - 9 + flap, 6, 4, .4, 0, 7); ctx.fill();
    glow('#ffe94d', 14); ctx.fillStyle = '#ffd400'; ctx.beginPath(); ctx.ellipse(cx, cy, 11, 8, 0, 0, 7); ctx.fill(); noGlow();
    ctx.fillStyle = '#1a0b2e'; ctx.fillRect(cx - 3, cy - 8, 3, 16); ctx.fillRect(cx + 3, cy - 7, 3, 14);
    ctx.fillStyle = PINK; ctx.beginPath(); ctx.moveTo(cx + 11, cy); ctx.lineTo(cx + 16, cy + 2); ctx.lineTo(cx + 10, cy + 4); ctx.fill();
    glow(PINK, 6); ctx.fillStyle = '#ff5fb0'; ctx.beginPath(); ctx.arc(cx - 7, cy - 2, 2.6, 0, 7); ctx.fill(); noGlow();
  }
  ctx.restore();
}

function neonHero(p) {
  if (!p) return;
  if (p.inv > 0 && Math.floor(p.inv * 12) % 2 === 0 && p.mode === 'play') return;
  const x = p.x, y = p.y, f = p.face;
  ctx.save();
  if (p.mode === 'dead') { ctx.translate(x + p.w / 2, y + p.h / 2); ctx.rotate(p.t * 8); ctx.translate(-x - p.w / 2, -y - p.h / 2); }
  const run = p.onGround && Math.abs(p.vx) > 20 ? Math.sin(p.anim * 3) * 3 : 0;
  ctx.fillStyle = '#1d2a44';
  ctx.fillRect(x + 4, y + 21 + Math.max(0, run), 5, 5 - Math.max(0, run));
  ctx.fillRect(x + 11, y + 21 + Math.max(0, -run), 5, 5 - Math.max(0, -run));
  // body + soft rim light
  glow('rgba(0,243,255,.6)', 8);
  ctx.fillStyle = '#2b8f8a'; rr(x, y + 10, p.w, 13, 5); ctx.fill();
  noGlow();
  glow('#ff9f1c', 8); ctx.fillStyle = '#ffb347'; ctx.fillRect(x + 7, y + 14, 6, 5); noGlow();
  ctx.fillStyle = '#20736f'; rr(x + (f > 0 ? 1 : p.w - 6), y + 13 - (p.onGround ? 0 : 4), 5, 8, 2); ctx.fill();
  // head
  ctx.fillStyle = '#7fd6cc'; rr(x + 1, y, p.w - 2, 12, 5); ctx.fill();
  ctx.fillStyle = '#0d1530'; rr(x + 3 + f, y + 3, 14, 6, 3); ctx.fill();
  const blink = Math.sin(clock * 2.5) > .97;
  glow(CYAN, 8); ctx.fillStyle = '#9ffcff';
  if (blink) { ctx.fillRect(x + 6 + f * 2, y + 6, 3, 1); ctx.fillRect(x + 12 + f * 2, y + 6, 3, 1); }
  else { ctx.fillRect(x + 6 + f * 2, y + 4, 3, 4); ctx.fillRect(x + 12 + f * 2, y + 4, 3, 4); }
  noGlow();
  ctx.strokeStyle = '#1d2a44'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 10, y); ctx.lineTo(x + 10 - f * 2, y - 6); ctx.stroke();
  glow(PINK, 12); ctx.fillStyle = Math.sin(clock * 6) > 0 ? PINK : '#ff8cc6'; ctx.beginPath(); ctx.arc(x + 10 - f * 2, y - 7, 3, 0, 7); ctx.fill(); noGlow();
  ctx.restore();
}

// =================== classic skin ===================
const CLASSIC_THEMES = [
  { top: '#6ec6ff', bottom: '#d6f1ff', far: '#9fd8a8', near: '#6dbb75', night: false, sun: '#fffbe0' },
  { top: '#ff9a62', bottom: '#ffd59e', far: '#d9876b', near: '#a8604d', night: false, sun: '#fff1b8' },
  { top: '#0f1c3f', bottom: '#2c3e78', far: '#24346a', near: '#1b2852', night: true },

function makeCobble(stone, light, mortar) {

      if (r() < .35) { g.strokeStyle = 'rgba(40,20,10,.45)'; g.lineWidth = 1; g.beginPath(); g.moveTo(x + 6 + r() * 12, y + 2); g.lineTo(x + 10 + r() * 10, y + 7); g.lineTo(x + 8 + r() * 12, y + 11); g.stroke(); }  // crack

function makeRocks(seed, count, minH, maxH) {
  const r = rng(seed), list = [];
  let x = 0;
  for (let i = 0; i < count; i++) {
    const w = 80 + r() * 160, h = minH + r() * (maxH - minH), pts = [];
    const steps = 4 + Math.floor(r() * 3);
    pts.push([0, 0]);
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const flat = r() < .5;
      pts.push([w * (.12 + t * .76), -h * (flat ? .95 + r() * .05 : .7 + r() * .3)]);
    }
    pts.push([w, 0]);
    list.push({ x, w, pts });
    x += w + 20 + r() * 140;
  }
  return { list, width: x };

const INK = '#1a1410';

const MIL_THEMES = [
  { sky: ['#4a2c48', '#a04436', '#ec6a2e', '#ffc067'], sun: '#ffe08a', far: '#5a3240', near: '#33202a', smoke: 3, fire: .5 },
  { sky: ['#3a2440', '#8a3a3a', '#e2572b', '#ffb347'], sun: '#ffd36b', far: '#4a2a3a', near: '#2e1a24', smoke: 4, fire: .8 },
  { sky: ['#120d22', '#2e1a38', '#5e2434', '#a83a2a'], sun: '#ff9a5a', far: '#2a1a2e', near: '#170e18', smoke: 5, fire: 1 },
];

// ruined city skyline (broken tops, holes, a few burning windows)
function makeRuins(seed, w, h, color, lit) {
  const c = offscreen(w, h), g = c.getContext('2d'), r = rng(seed);
  let x = 0;
  while (x < w) {
    const bw = 40 + r() * 90, bh = 70 + r() * (h - 90), top = h - bh;
    g.beginPath(); g.moveTo(x, h); g.lineTo(x, top + r() * 20);
    const n = 3 + Math.floor(r() * 4);
    for (let i = 1; i <= n; i++) g.lineTo(x + bw * i / n, top + r() * 40 * (i % 2 ? 1 : .3));
    g.lineTo(x + bw, h); g.closePath();
    g.fillStyle = color; g.fill();
    g.globalCompositeOperation = 'destination-out';   // blown-out holes
    for (let i = 0; i < 2 + r() * 3; i++) { g.beginPath(); g.ellipse(x + r() * bw, top + 30 + r() * (bh - 40), 4 + r() * 9, 3 + r() * 7, r() * 3, 0, 7); g.fill(); }
    g.globalCompositeOperation = 'source-over';
    for (let wy = top + 30; wy < h - 10; wy += 16) for (let wx = x + 6; wx < x + bw - 8; wx += 13) {
      const v = r();
      if (v < .5) { g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(wx, wy, 6, 8); }
      else if (lit && v > .93) { g.fillStyle = 'rgba(255,140,50,.85)'; g.fillRect(wx, wy, 6, 8); }
    }
    x += bw + r() * 30;
  }
  return c;
}
const ruinsFar = MIL_THEMES.map((t, i) => makeRuins(61 + i, 1500, 260, t.far, false));
const ruinsNear = MIL_THEMES.map((t, i) => makeRuins(83 + i, 1700, 220, t.near, true));

function smokeColumn(sx, base, k0, fire) {
  for (let k = 0; k < 12; k++) {
    const t = (clock * .12 + k / 12 + k0) % 1;
    const x = sx + Math.sin(t * 6 + k) * 14 + t * 90, y = base - t * 330, r = 12 + t * 46;
    ctx.globalAlpha = (1 - t) * .55; ctx.fillStyle = k % 2 ? '#1e1418' : '#2a1d22';
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (fire > 0) {
    const g = ctx.createRadialGradient(sx, base, 2, sx, base, 46);
    g.addColorStop(0, `rgba(255,170,60,${.7 * fire})`); g.addColorStop(1, 'rgba(255,90,30,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, base, 46, 0, 7); ctx.fill();
  }
}

function milBg(li) {

  sg.addColorStop(0, th.sun); sg.addColorStop(.25, 'rgba(255,200,100,.55)'); sg.addColorStop(1, 'rgba(255,120,50,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, 0, VIEW_W, VIEW_H);

}
function casings(x, y, seed) {
  for (let i = 0; i < 3; i++) {
    const cx = x + ((seed * 7 + i * 9) % 24), a = (seed + i) * .9;

function hedgehog(x, y) {   // czech hedgehog barrier (decoration)
  ctx.lineCap = 'round';
  for (const [a, b, c, d] of [[-9, 0, 7, -16], [9, 0, -7, -16], [-11, -6, 11, -6]]) {

  }

}
function wireCoil(x, y, w) {
  ctx.strokeStyle = '#3a3633'; ctx.lineWidth = 1.4;

}
function rivet(x, y, r = 1.6) { ctx.fillStyle = '#c9cfd4'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(x + .5, y + .5, r * .6, 0, 7); ctx.fill(); }

function milTiles(x1, x2) {
  const outline = new Path2D();
  for (let ty = 0; ty < H; ty++) for (let tx = x1; tx <= x2; tx++) {
    const c = tileAt(tx, ty), x = tx * T, y = ty * T;
    if (c === '#') {
      ctx.fillStyle = '#76462a'; ctx.fillRect(x, y, T, T);
      const h = (tx * 37 + ty * 91) % 7;
      ctx.strokeStyle = '#4e2e1a'; ctx.lineWidth = 1.5; ctx.beginPath();   // cel-shaded cracks
      ctx.moveTo(x + 6 + h * 3, y + 4); ctx.lineTo(x + 9 + h * 2, y + 14); ctx.lineTo(x + 5 + h * 3, y + 26); ctx.stroke();
      ctx.fillStyle = '#93603b'; ctx.fillRect(x + 18 - h, y + 8 + h * 2, 7, 3);
      ctx.fillStyle = '#5c3720'; ctx.fillRect(x + 4 + h * 2, y + 20, 8, 3);
      const L = tileAt(tx - 1, ty) !== '#', R = tileAt(tx + 1, ty) !== '#', U = tileAt(tx, ty - 1) !== '#';
      if (L && tx > 0) { ctx.fillStyle = 'rgba(255,170,100,.18)'; ctx.fillRect(x, y, 6, T); outline.moveTo(x + 1, y); outline.lineTo(x + 1, y + T); }
      if (R && tx < lvl.W - 1) { ctx.fillStyle = 'rgba(30,10,0,.35)'; ctx.fillRect(x + T - 8, y, 8, T); outline.moveTo(x + T - 1, y); outline.lineTo(x + T - 1, y + T); }
      if (U) {
        ctx.fillStyle = '#a8784e'; ctx.fillRect(x, y, T, 10);
        ctx.fillStyle = '#c99a66'; ctx.fillRect(x, y, T, 3);
        ctx.fillStyle = '#76462a'; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(x + 4 + i * 8, y + 10, 3.5, 0, Math.PI); ctx.fill(); }
        outline.moveTo(x, y + 1); outline.lineTo(x + T, y + 1);
      }
    } else if (c === 'B') {   // riveted steel plate
      const g = ctx.createLinearGradient(0, y, 0, y + T);
      g.addColorStop(0, '#8d9296'); g.addColorStop(.5, '#6b7075'); g.addColorStop(1, '#4b5054');
      ctx.fillStyle = g; rr(x + 1, y + 1, T - 2, T - 2, 3); ctx.fill(); ink(2);
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x + 4, y + 4, T - 8, 3);
      rivet(x + 6, y + 6); rivet(x + T - 6, y + 6); rivet(x + 6, y + T - 6); rivet(x + T - 6, y + T - 6);
    } else if (c === 'S') {   // barbed wire = hazard
      ctx.fillStyle = '#5a3a22'; ctx.fillRect(x + 3, y + 12, 4, 20); ctx.fillRect(x + T - 7, y + 12, 4, 20);
      ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.strokeRect(x + 3, y + 12, 4, 20); ctx.strokeRect(x + T - 7, y + 12, 4, 20);
      wireCoil(x + 4, y + 22, T - 6);
    } else if (c === 'J') {   // spring pad on an ammo crate
      ctx.fillStyle = '#4f6b33'; rr(x + 3, y + T - 10, T - 6, 10, 2); ctx.fill(); ink(1.5);
      ctx.strokeStyle = '#8a8f94'; ctx.lineWidth = 3; ctx.beginPath();
      for (let i = 0; i < 4; i++) { ctx.moveTo(x + 8, y + T - 12 - i * 5); ctx.lineTo(x + T - 8, y + T - 15 - i * 5); }
      ctx.stroke();
      ctx.fillStyle = '#e8b923'; rr(x + 2, y + 6, T - 4, 7, 2); ctx.fill(); ink(1.5);
      ctx.fillStyle = INK; for (let i = 0; i < 4; i++) ctx.fillRect(x + 5 + i * 7, y + 6, 3, 7);
    }
  }
  ctx.lineCap = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke(outline); ctx.lineCap = 'butt';
  // decorations on top of the ground + barbed wire at the bottom of gaps
  for (let tx = x1; tx <= x2; tx++) {
    let gap = true;
    for (let ty = 0; ty < H; ty++) {
      const c = tileAt(tx, ty);
      if (c === '#') gap = false;
      if (c === '#' && tileAt(tx, ty - 1) === '.' && ty > 2) {
        const x = tx * T, y = ty * T, h = (tx * 73 + ty * 31) % 17;

        else if (h === 5 || h === 9 || h === 15) casings(x + 4, y, tx);
        else if (h === 7) sandbag(x + 16, y - 4, 18);
      }
    }
    if (gap) wireCoil(tx * T, H * T - 10, T);
  }
}

function milTank(e) {
  const cx = e.x + e.w / 2, by = e.y + e.h, face = e.face || Math.sign(e.vx) || -1;

  ctx.fillStyle = '#3f5226'; ctx.fillRect(cx - 21, by - 14, 42, 3);
  ctx.fillStyle = '#7f9a52'; ctx.fillRect(cx - 21, by - 18, 42, 2);

  ctx.fillStyle = '#3f5226'; rr(cx + (face > 0 ? 28 - rec : -34 + rec), by - 27, 6, 6.5, 1); ctx.fill(); ink(1.5);
  ctx.beginPath(); ctx.ellipse(cx - face * 2, by - 21, 13, 8, 0, Math.PI, 0); ctx.closePath();
  ctx.fillStyle = '#5f7a3a'; ctx.fill(); ink(2);
  ctx.fillStyle = '#7f9a52'; ctx.beginPath(); ctx.ellipse(cx - face * 5, by - 25, 5, 2, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#f2f2e8'; ctx.save(); ctx.translate(cx - face * 10, by - 14.5); star(0, 0, 3.2, 1.4); ctx.fill(); ctx.restore();

function milEnemy(e) {

function milHero(p) {   // cartoon soldier: helmet, goggles, backpack
  if (!p) return;
  if (p.inv > 0 && Math.floor(p.inv * 12) % 2 === 0 && p.mode === 'play') return;
  const f = p.face, x = p.x, y = p.y + p.h - 26;   // draw as if standing (26 tall)
  ctx.save();
  if (p.mode === 'dead') { ctx.translate(x + 10, y + 13); ctx.rotate(p.t * 8); ctx.translate(-x - 10, -y - 13); }
  if (p.sliding > 0) { ctx.translate(x + 10 + f * 4, y + 26); ctx.rotate(-f * 1.2); ctx.translate(-x - 10, -y - 26); }
  const run = p.onGround && Math.abs(p.vx) > 20 && !(p.sliding > 0) ? Math.sin(p.anim * 3) : 0;
  const air = !p.onGround && !(p.sliding > 0);
  // backpack (behind)
  ctx.fillStyle = '#4f5e33'; rr(x + (f > 0 ? -3 : 13), y + 11, 10, 11, 2); ctx.fill(); ink(1.5);
  ctx.fillStyle = '#6b7a45'; ctx.fillRect(x + (f > 0 ? -2 : 14), y + 12, 8, 2);
  // legs
  const legs = [[x + 5, run * 4 + (air ? -2 : 0)], [x + 11, -run * 4 + (air ? 3 : 0)]];
  for (const [lx, sw] of legs) {
    ctx.save(); ctx.translate(lx + 2, y + 20); ctx.rotate(sw * .12 * f);
    ctx.fillStyle = '#5a6b3a'; ctx.fillRect(-2.5, 0, 5, 4); ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.strokeRect(-2.5, 0, 5, 4);
    ctx.fillStyle = '#1e1a16'; rr(-3 + (f > 0 ? 0 : -1), 3.5, 7, 3, 1); ctx.fill();
    ctx.restore();
  }
  // torso
  ctx.fillStyle = '#6b7f45'; rr(x + 3, y + 11, 14, 10, 3); ctx.fill(); ink(1.5);
  ctx.fillStyle = '#56683a'; ctx.fillRect(x + 3 + (f > 0 ? 0 : 9), y + 12, 5, 8);   // cel shadow
  ctx.fillStyle = '#3b2c1c'; ctx.fillRect(x + 3, y + 18, 14, 2);
  ctx.fillStyle = '#c9a03a'; ctx.fillRect(x + 9, y + 18, 2, 2);
  ctx.strokeStyle = '#3b2c1c'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x + (f > 0 ? 5 : 15), y + 11); ctx.lineTo(x + (f > 0 ? 12 : 8), y + 18); ctx.stroke();
  // arm (pumping)
  ctx.save(); ctx.translate(x + 10 + f * 4, y + 13); ctx.rotate((-run * .9 - (air ? .9 : 0)) * f);
  ctx.fillStyle = '#6b7f45'; rr(-2, 0, 4.5, 7, 2); ctx.fill(); ink(1);
  ctx.fillStyle = '#f1c27d'; ctx.beginPath(); ctx.arc(0, 7.5, 2, 0, 7); ctx.fill(); ink(1);
  ctx.restore();
  // rifle
  const gx = x + 10 + f * 2, gy = y + 14;
  ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.rect(Math.min(gx, gx + f * 15), gy - 1.5, 15, 3.5); ctx.fill(); ink(1);
  ctx.fillStyle = '#6b4a2a'; ctx.fillRect(gx - f * 5 - (f > 0 ? 0 : 5), gy - 1, 5, 4);
  ctx.fillStyle = '#2b2b2b'; ctx.fillRect(gx + f * 6 - 1, gy + 1.5, 2.5, 3);
  if (p.fireT > 0) {
    const mx = gx + f * 17;
    ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.moveTo(mx, gy - 4); ctx.lineTo(mx + f * 9, gy); ctx.lineTo(mx, gy + 4); ctx.lineTo(mx + f * 3, gy); ctx.closePath(); ctx.fill();
  }
  // head
  ctx.fillStyle = '#f1c27d'; rr(x + 5, y + 4, 11, 8, 3); ctx.fill(); ink(1.5);
  ctx.fillStyle = INK; ctx.fillRect(x + 10 + f * 3, y + 7, 1.6, 2);
  ctx.strokeStyle = '#8a4a2a'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + 9 + f * 2, y + 10.5); ctx.lineTo(x + 12 + f * 2, y + 10); ctx.stroke();
  // helmet + goggles
  ctx.beginPath(); ctx.ellipse(x + 10.5, y + 5, 8, 6, 0, Math.PI, 0); ctx.lineTo(x + 19, y + 6); ctx.lineTo(x + 2, y + 6); ctx.closePath();
  ctx.fillStyle = '#5f7a3a'; ctx.fill(); ink(1.5);
  ctx.fillStyle = '#7f9a52'; ctx.beginPath(); ctx.ellipse(x + 8 + f * 2, y + 1.5, 3, 1.4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#3b2c1c'; ctx.fillRect(x + 3, y + 2.5, 15, 2);
  for (const gx of [x + 9.5 + f * 2, x + 13.5 + f * 2]) { ctx.fillStyle = '#e8b04a'; ctx.beginPath(); ctx.arc(gx, y + 3.5, 2.1, 0, 7); ctx.fill(); ink(1); ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(gx - 1, y + 2.5, 1, 1); }
  ctx.restore();
}

function milPlane(e) {   // cartoon propeller bomber

function drawBomb(q) {
  ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(Math.atan2(q.vy, q.vx) - Math.PI / 2);
  ctx.beginPath(); ctx.moveTo(-3, -9); ctx.lineTo(-6, -13); ctx.lineTo(6, -13); ctx.lineTo(3, -9); ctx.closePath(); ctx.fillStyle = '#3a3e3a'; ctx.fill(); ink(1.2);
  ctx.beginPath(); ctx.ellipse(0, 0, 5, 9, 0, 0, 7); ctx.fillStyle = '#4a524a'; ctx.fill(); ink(1.5);

}

function drawShots() {
  for (const q of shots) {

        ctx.save(); ctx.translate(q.x, q.y); ctx.scale(d, 1);
        ctx.beginPath(); ctx.moveTo(-6, -3.5); ctx.lineTo(3, -3.5); ctx.quadraticCurveTo(9, 0, 3, 3.5); ctx.lineTo(-6, 3.5); ctx.closePath();
        ctx.fillStyle = '#555a5e'; ctx.fill(); ink(1.5); ctx.fillStyle = '#c9a03a'; ctx.fillRect(-6, -3.5, 3, 7);
        ctx.restore(); continue;
      }

      ctx.beginPath(); ctx.moveTo(q.x - q.vx * .03, q.y - q.vy * .03); ctx.lineTo(q.x, q.y); ctx.stroke(); ctx.lineCap = 'butt';
    } else if (skin === 'neon') {
      const col = q.kind === 'pbullet' ? CYAN : PINK;

    } else if (skin === 'cowboy') {
      if (q.kind === 'pbullet') { ctx.fillStyle = '#5a5a5a'; ctx.beginPath(); ctx.ellipse(q.x, q.y, 4, 2, Math.atan2(q.vy, q.vx), 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(255,240,200,.7)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(q.x - q.vx * .03, q.y - q.vy * .03); ctx.lineTo(q.x, q.y); ctx.stroke(); }
      else if (q.kind === 'shell') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(clock * 12); ctx.strokeStyle = '#3f9b4a'; ctx.lineWidth = 2; ctx.beginPath(); for (let i = 0; i < 4; i++) { ctx.moveTo(0, 0); ctx.lineTo(Math.cos(i * 1.57) * 6, Math.sin(i * 1.57) * 6); } ctx.stroke(); ctx.restore(); }

function drawWeapon(p) {   // weapon / muzzle flash for the non-military heroes
  if (!p || skin === 'military' || p.mode !== 'play') return;
  if (p.inv > 0 && Math.floor(p.inv * 12) % 2 === 0) return;
  const f = p.face, hx = p.x + 10 + f * 9, hy = p.y + 16;
  if (skin === 'cowboy') {
    ctx.fillStyle = '#4a4a4a'; ctx.fillRect(f > 0 ? hx : hx - 9, hy - 2, 9, 3);
    ctx.fillStyle = '#6b3e1e'; ctx.fillRect(f > 0 ? hx - 1 : hx - 1, hy, 3, 4);
  } else {
    ctx.fillStyle = skin === 'neon' ? '#1d2a44' : '#264653'; rr(f > 0 ? hx - 2 : hx - 6, hy - 3, 8, 5, 2); ctx.fill();
    ctx.fillStyle = skin === 'neon' ? CYAN : '#ff9f1c'; ctx.fillRect(f > 0 ? hx + 5 : hx - 6, hy - 2, 1.5, 3);
  }
  if (p.fireT > 0) {
    const mx = hx + f * 11, col = { cowboy: '#ffe066', neon: CYAN, classic: '#ffb347' }[skin];
    if (skin === 'neon') glow(CYAN, 14);
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(mx - f * 2, hy - 4); ctx.lineTo(mx + f * 7, hy - .5); ctx.lineTo(mx - f * 2, hy + 3); ctx.closePath(); ctx.fill();
    noGlow();
  }
}

// =================== background music (one tune per style) ===================
// classic: Scott Joplin – "The Entertainer" (1902, public domain; famous from the film "The Sting")
// neon:    Edvard Grieg – "In the Hall of the Mountain King" (1875, public domain; heard in many films)
// cowboy:  "Oh My Darling, Clementine" (1884 folk song, public domain; a classic in western movies)
// military: original action march (snare drums + brass)
const NOTE_BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function freq(n) {
  const m = /^([A-G])(#|b)?(-?\d)$/.exec(n);
  const semi = NOTE_BASE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] + 1) * 12;
  return 440 * Math.pow(2, (semi - 69) / 12);
}
const CHORDS = {
  C: ['C2', ['E3', 'G3', 'C4']], G7: ['G1', ['B2', 'D3', 'F3']], D7: ['D2', ['F#3', 'A3', 'C4']], G: ['G1', ['B2', 'D3', 'G3']],
  Bm: ['B1', ['D3', 'F#3', 'B3']], 'C#': ['C#2', ['F3', 'G#3', 'C#4']], Cmaj: ['C2', ['C3', 'E3', 'G3']], D: ['D2', ['D3', 'F#3', 'A3']],
  'F#': ['F#1', ['F#3', 'A#3', 'C#4']], Em: ['E2', ['E3', 'G3', 'B3']],
};
const TRACKS = {
  classic: { bpm: 96, bpb: 2, style: 'rag', lead: 'square', leadVol: .045,
    melody: 'D4:.25 D#4:.25 E4:.25 C5:.5 E4:.25 C5:.5 E4:.25 C5:1.75 C5:.25 D5:.25 D#5:.25 E5:.25 C5:.25 D5:.25 E5:.5 B4:.25 D5:.5 C5:1.25 ' +
             'D4:.25 D#4:.25 E4:.25 C5:.5 E4:.25 C5:.5 E4:.25 C5:1.75 A4:.25 G4:.25 F#4:.25 A4:.25 C5:.25 E5:.5 D5:.25 C5:.25 A4:.25 D5:1.5',
    chords: ['C', 'C', 'C', 'G7', 'C', 'C', 'D7', 'G7'] },
  neon: { bpm: 138, bpb: 2, style: 'synth', lead: 'sawtooth', leadVol: .04, octaveRepeat: true,
    melody: 'B3:.5 C#4:.5 D4:.5 E4:.5 F#4:.5 D4:.5 F#4:1 F4:.5 C#4:.5 F4:1 E4:.5 C4:.5 E4:1 ' +
            'B3:.5 C#4:.5 D4:.5 E4:.5 F#4:.5 D4:.5 F#4:.5 B4:.5 A4:.5 F#4:.5 D4:.5 F#4:.5 A4:2',
    chords: ['Bm', 'Bm', 'C#', 'Cmaj', 'Bm', 'Bm', 'D', 'F#'] },
  cowboy: { bpm: 150, bpb: 3, style: 'waltz', lead: 'triangle', leadVol: .09, vibrato: true,
    melody: 'G4:.5 G4:.5 G4:1 D4:1 D4:1 B4:.5 B4:.5 B4:1 G4:2 G4:.5 B4:.5 D5:1.5 D5:.5 C5:.5 B4:.5 A4:2 A4:.5 B4:.5 ' +
            'C5:1.5 C5:.5 B4:.5 A4:.5 B4:1 G4:1 G4:.5 B4:.5 A4:1.5 D4:.5 F#4:.5 A4:.5 G4:3 R:3',
    chords: ['G', 'G', 'G', 'G', 'D7', 'D7', 'G', 'D7', 'G', 'G'] },
  military: { bpm: 112, bpb: 4, style: 'march', lead: 'sawtooth', leadVol: .045,
    melody: 'E4:1.5 E4:.5 G4:1 B4:1 A4:1.5 G4:.5 F#4:1 D4:1 E4:1.5 E4:.5 G4:1 B4:1 D5:2 B4:2 ' +
            'C5:1.5 B4:.5 A4:1 C5:1 B4:1.5 A4:.5 G4:1 B4:1 A4:1 G4:1 F#4:1 D4:1 E4:4',
    chords: ['Em', 'D', 'Em', 'G', 'Cmaj', 'G', 'D', 'Em'] },
};

let musicOn = true;
try { musicOn = localStorage.getItem('bibo-music') !== 'off'; } catch (e) {}
let musicGain = null, musicTimer = null, music = null;
const noiseBuf = { b: null };

function mOut() {
  const a = ac(); if (!a) return null;
  if (!musicGain) { musicGain = a.createGain(); musicGain.gain.value = .8; musicGain.connect(a.destination); }
  return musicGain;
}
function mTone(f, t, dur, wave, vol, opts = {}) {
  const a = ac(), out = mOut(); if (!a || !out) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = wave; o.frequency.setValueAtTime(f, t);
  if (opts.slide) o.frequency.exponentialRampToValueAtTime(f * opts.slide, t + dur);
  if (opts.vib) { const l = a.createOscillator(), lg = a.createGain(); l.frequency.value = 5.5; lg.gain.value = f * .012; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + dur + .05); }
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + (opts.attack || .01));
  g.gain.setValueAtTime(vol, t + Math.max(.02, dur * (opts.sustain ?? .6)));

  if (opts.lp) { const fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = opts.lp; fl.Q.value = opts.q || 1; o.connect(fl); node = fl; }
  node.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .02);
}
function mNoise(t, dur, vol, type = 'highpass', f = 7000) {
  const a = ac(), out = mOut(); if (!a || !out) return;
  if (!noiseBuf.b) { const len = a.sampleRate * .5; noiseBuf.b = a.createBuffer(1, len, a.sampleRate); const d = noiseBuf.b.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf.b; fl.type = type; fl.frequency.value = f;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0005, t + dur);
  s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + dur + .02);
}
const mKick = (t, v = .16) => mTone(150, t, .14, 'sine', v, { slide: .27, sustain: .1 });
const mSnare = (t, v = .06) => { mNoise(t, .12, v, 'bandpass', 1800); mTone(190, t, .07, 'triangle', v * .6, { sustain: .1 }); };
const mHat = (t, v = .025) => mNoise(t, .04, v, 'highpass', 8000);
const mBlock = (t, f = 900) => mTone(f, t, .05, 'sine', .05, { sustain: .1 });

function buildTrack(key) {
  const tr = TRACKS[key], ev = [];
  let mel = tr.melody.trim().split(/\s+/).map(s => { const [n, d] = s.split(':'); return [n, +d]; });
  let chords = tr.chords;
  if (tr.octaveRepeat) {   // second time round an octave higher
    mel = mel.concat(mel.map(([n, d]) => [n === 'R' ? 'R' : n.replace(/(-?\d)$/, x => +x + 1), d]));
    chords = chords.concat(chords);
  }
  let t = 0;
  for (const [n, d] of mel) {
    if (n !== 'R') {
      const f = freq(n);
      ev.push({ t, fn: (at, spb) => mTone(f, at, d * spb * .95, tr.lead, tr.leadVol, { vib: tr.vibrato, lp: tr.lead === 'sawtooth' ? 2200 : 0, sustain: .7 }) });
    }
    t += d;
  }
  const len = Math.max(t, chords.length * tr.bpb);
  chords.forEach((name, b) => {
    const [root, tones] = CHORDS[name], t0 = b * tr.bpb, rf = freq(root), tf = tones.map(freq);
    const chord = (at, spb, v = .022, l = .4) => tf.forEach(f => mTone(f, at, l * spb, 'triangle', v, { sustain: .3 }));
    const add = (dt, fn) => ev.push({ t: t0 + dt, fn });
    if (tr.style === 'rag') {
      add(0, (at, spb) => mTone(rf, at, .45 * spb, 'triangle', .1));
      add(.5, (at, spb) => chord(at, spb));

function ambBirds(n, color, y0, speed, size = 1) {
  ctx.strokeStyle = color; ctx.lineWidth = 2 * size; ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const x = ((i * 377 + clock * (speed + i * 9) - cam * .15) % (VIEW_W + 300) + VIEW_W + 300) % (VIEW_W + 300) - 150;
    const y = y0 + i * 22 + Math.sin(clock * 1.3 + i * 2) * 10, flap = Math.sin(clock * 9 + i) * 5 * size, w = 8 * size;

  }
  ctx.lineCap = 'butt';
}
function ambShootingStars(n) {

    const ph = (clock * .18 + i * .41) % 1;
    if (ph > .14) continue;
    const k = ph / .14, sx = 120 + ((i * 331) % 700), sy = 30 + ((i * 97) % 120);
    const x = sx + k * 220, y = sy + k * 90;

    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, `rgba(255,255,240,${1 - k})`);

  }
}
function ambFireflies(n, color, yMin, yMax) {
  for (let i = 0; i < n; i++) {
    const x = ((i * 131 + Math.sin(clock * .4 + i) * 60 - cam * .3) % VIEW_W + VIEW_W) % VIEW_W;
    const y = yMin + ((i * 53) % (yMax - yMin)) + Math.cos(clock * .7 + i * 1.7) * 18;
    const a = .25 + .75 * Math.max(0, Math.sin(clock * 2.2 + i * 1.3));

    ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 7); ctx.fill();
    ctx.globalAlpha = a * .25; ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill();

}
function ambFloaters(n, colors, speed, size) {   // leaves / petals / dust drifting with the wind

    const t = clock * speed + i * 97;
    const x = ((t * 1.0 + i * 211 - cam * .5) % (VIEW_W + 100) + VIEW_W + 100) % (VIEW_W + 100) - 50;
    const y = ((i * 71 + clock * 18 * (1 + (i % 3) * .3)) % (VIEW_H + 40)) - 20 + Math.sin(clock * 2 + i) * 12;

}

function ambClassic(li) {

function ambNeon(li) {

  for (let i = 0; i < 6; i++) {
    const dir = i % 2 ? 1 : -1, sp = 90 + i * 25, lane = 150 + (i % 3) * 45;
    const x = dir > 0 ? ((clock * sp + i * 300 - cam * .25) % (VIEW_W + 400) + VIEW_W + 400) % (VIEW_W + 400) - 200

    const col = i % 3 === 0 ? CYAN : i % 3 === 1 ? PINK : '#b26bff';

function ambWindmill(x, base, s) {

function ambCow(li) {

function draw() {
  const S = SKINS[skin];
  const li = lvl ? levelIndex : (skin === 'cowboy' ? 0 : 1);
  S.bg(li); S.amb(li);
  if (!lvl) return;
  ctx.save(); ctx.translate(-Math.round(cam), 0);
  for (const r of lvl.rooms) S.room(r);
  const x1 = Math.floor(cam / T) - 1, x2 = x1 + VIEW_W / T + 3;
  if (skin === 'military') milStartBunker();

  for (const c of lvl.checks) S.check(c);
  if (lvl.door) S.door(lvl.door);
  for (const m of lvl.movers) S.mover(m);
  for (const g of lvl.gems) if (!g.got) S.gem(g);
  for (const e of lvl.enemies) S.enemy(e);
  S.hero(player); drawWeapon(player);
  for (const pp of lvl.pipes) S.pipe(pp);   // pipes/barrels drawn over the hero so he disappears inside
  drawShots();

  if (S.glowFx) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const q of particles) { ctx.globalAlpha = Math.min(1, q.life * 2); ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(q.x, q.y, 3.5, 0, 7); ctx.fill(); }
    ctx.restore();
  } else {
    for (const q of particles) { ctx.globalAlpha = Math.min(1, q.life * 2); ctx.fillStyle = q.color; ctx.fillRect(q.x - 3, q.y - 3, 6, 6); }
    ctx.globalAlpha = 1;
  }
  ctx.font = 'bold 24px "Baloo Bhaijaan 2", sans-serif'; ctx.textAlign = 'center';
  for (const f of floating) {
    ctx.globalAlpha = f.life;
    if (S.glowFx) { glow(CYAN, 12); ctx.fillStyle = '#e9ffff'; ctx.fillText(f.text, f.x, f.y); noGlow(); }
    else { ctx.fillStyle = '#fff'; ctx.strokeStyle = '#223'; ctx.lineWidth = 4; ctx.strokeText(f.text, f.x, f.y); ctx.fillText(f.text, f.x, f.y); }
  }
  ctx.globalAlpha = 1;

}

}
dpad.addEventListener('pointerdown', e => { e.preventDefault(); try { dpad.setPointerCapture(e.pointerId); } catch (_) {} padTouches.set(e.pointerId, e.clientX); padUpdate(); });
dpad.addEventListener('pointermove', e => { if (padTouches.has(e.pointerId)) { padTouches.set(e.pointerId, e.clientX); padUpdate(); } });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) dpad.addEventListener(ev, e => { padTouches.delete(e.pointerId); padUpdate(); });
// right side: jump and enter-pipe buttons
document.querySelectorAll('.tpad.right .tbtn').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (_) {} ac();
    if (k === 'Space' && !keys.Space && player) player.jumpBuf = .12;
    keys[k] = true; b.classList.add('on');
  });
  const up = () => { keys[k] = false; b.classList.remove('on'); };
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, up);
});
document.getElementById('pauseBtn').onclick = () => togglePause();
document.querySelectorAll('.musicBtn').forEach(b => { b.textContent = musicOn ? '🎵' : '🔇'; b.onclick = e => { e.stopPropagation(); setMusicOn(!musicOn); }; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });
document.addEventListener('contextmenu', e => e.preventDefault());
let lastTouchUi = '';
function syncTouchUi() {
  const k = state + '|' + isTouch;
  if (k === lastTouchUi) return; lastTouchUi = k;
  document.getElementById('touch').classList.toggle('hidden', !(isTouch && state === 'play'));
  document.getElementById('pauseBtn').classList.toggle('hidden', !(state === 'play'));
  document.getElementById('musicHud').classList.toggle('hidden', !(state === 'play'));
}

// offline support when hosted (GitHub Pages): cache the game on first visit
if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
// =================== main loop ===================
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(.1, (now - last) / 1000); last = now;
  while (acc >= 1 / 60) { update(1 / 60); acc -= 1 / 60; }
  draw(); syncTouchUi();
  requestAnimationFrame(frame);
}
applyLang();
requestAnimationFrame(frame);
</script>
</body>
